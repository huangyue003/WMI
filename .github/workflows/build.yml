name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build IFactory.WMI.slnx -c Release -warnaserror
      - run: dotnet test IFactory.WMI.slnx -c Release --no-build
